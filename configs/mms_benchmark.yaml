# reteco-v1/configs/mms_benchmark.yaml
benchmark_name: "coupled_mms_unit_square"
domain: [0.0, 1.0, 0.0, 1.0]
final_time_T: 0.5
delta_tracer: 0.4                   # 0 < delta < 1 per garantire c*(x,y,t) > 0
fe_degrees:
  displacement_degree: 2            # Q_2 (Taylor-Hood)
  pressure_degree: 1                # Q_1 (Taylor-Hood)
  tracer_degree: 1                  # Q_1

# Raffinamento spaziale con M scalato come N^2 per eliminare il plateau temporale O(dt)
spatial_refinement_study:
  subdivisions_N: [4, 8, 16]
  coordinated_time_steps_M: [100, 400, 1600]
  grading_r: 1.0

# Raffinamento temporale su mesh spaziale fine con elementi quadratici Q_2
temporal_refinement_study:
  fixed_subdivisions_N: 24
  time_steps_M: [10, 20, 40, 80]
  grading_r: 1.0